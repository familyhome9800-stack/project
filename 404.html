<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | Самая Красивая</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #fffaf4;
            color: #2e2e2e;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Градиентное число 404 */
        .error-number {
            font-size: 180px;
            font-weight: 400;
            line-height: 1;
            background: linear-gradient(135deg, #b76e79, #d4a59a, #e8c1a0, #b76e79);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            animation: gradientShift 8s ease infinite;
            background-size: 300% auto;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Заголовок */
        h1 {
            font-size: 42px;
            font-weight: 350;
            color: #573f3f;
            margin-bottom: 20px;
        }

        /* Контейнер для слова "страница" */
        .page-word {
            position: relative;
            display: inline-block;
        }

        /* Текст */
        p {
            font-size: 20px;
            color: #7f5a5a;
            margin-bottom: 30px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Кнопка */
        .home-btn {
            display: inline-block;
            font-size: 22px;
            padding: 16px 50px;
            border-radius: 50px;
            text-decoration: none;
            border: none;
            color: white;
            background: linear-gradient(45deg, #b76e79, #d4a59a, #b76e79);
            background-size: 200% auto;
            box-shadow: 0 8px 20px rgba(183,110,121,0.3);
            transition: 0.3s;
            margin-top: 20px;
        }

        .home-btn:hover {
            background-position: right center;
            transform: scale(1.02);
            box-shadow: 0 12px 28px rgba(183,110,121,0.4);
        }

        /* Дополнительные ссылки */
        .links {
            margin-top: 40px;
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            color: #b76e79;
            text-decoration: none;
            font-size: 18px;
            border-bottom: 1px dashed #edd7cb;
            padding-bottom: 3px;
            transition: 0.2s;
        }

        .links a:hover {
            border-bottom-color: #b76e79;
            color: #9e5b65;
        }

        /* ===== БАБОЧКА ===== */
        .butterfly {
            position: fixed;
            width: 55px;
            height: auto;
            z-index: 100;
            pointer-events: none;
            filter: drop-shadow(0 5px 15px rgba(183,110,121,0.2));
            
            /* Начальное положение — сидит на слове "страница" */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            
            /* Плавная анимация с easing-функцией */
            animation: butterflyJourney 16s cubic-bezier(0.25, 0.1, 0.15, 1) forwards;
            animation-delay: 1s;
        }
        
        .butterfly img {
            display: block;
            width: 100%;
            height: auto;
            /* Постоянное махание крыльями */
            animation: flapWings 0.25s ease-in-out infinite;
            transform-origin: center;
        }
        
        /* Машущие крылья */
        @keyframes flapWings {
            0%, 100% {
                transform: scaleX(1);
            }
            50% {
                transform: scaleX(0.6);
            }
        }
        
        /* Плавный полёт бабочки: сидение → кружение вокруг текста → пролёт мимо слова → улёт */
        @keyframes butterflyJourney {
            /* 0-10%: сидит на слове "страница" */
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg) scale(1);
            }
            10% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg) scale(1);
            }
            
            /* 10-20%: плавно взлетает вверх */
            15% {
                transform: translate(-45%, -110%) rotate(-3deg) scale(1.02);
            }
            20% {
                transform: translate(-35%, -105%) rotate(2deg) scale(1);
            }
            
            /* 20-35%: плавно кружит справа */
            27% {
                transform: translate(30%, -85%) rotate(10deg) scale(1.01);
            }
            35% {
                transform: translate(45%, -50%) rotate(5deg) scale(0.99);
            }
            
            /* 35-50%: плавно кружит снизу */
            42% {
                transform: translate(25%, 20%) rotate(-5deg) scale(1);
            }
            50% {
                transform: translate(-15%, 35%) rotate(-10deg) scale(1.01);
            }
            
            /* 50-65%: плавно кружит слева */
            57% {
                transform: translate(-55%, 10%) rotate(-3deg) scale(0.99);
            }
            65% {
                transform: translate(-65%, -25%) rotate(8deg) scale(1);
            }
            
            /* 65-80%: поднимается и пролетает мимо слова "упорхнула" */
            72% {
                transform: translate(-30%, -80%) rotate(12deg) scale(1.02);
            }
            80% {
                transform: translate(20%, -95%) rotate(18deg) scale(1);
            }
            
            /* 80-92%: продолжает полёт дальше, пролетая мимо */
            86% {
                transform: translate(60%, -110%) rotate(25deg) scale(0.95);
            }
            92% {
                opacity: 0.7;
                transform: translate(100%, -140%) rotate(35deg) scale(0.85);
            }
            
            /* 92-100%: исчезает за пределами экрана */
            96% {
                opacity: 0.2;
                transform: translate(140%, -180%) rotate(45deg) scale(0.7);
            }
            100% {
                opacity: 0;
                transform: translate(180%, -220%) rotate(55deg) scale(0.5);
            }
        }

        /* Анимация подпрыгивания для слова "упорхнула" */
        .flew-away {
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        /* Декоративные точки */
        .dots {
            margin: 30px 0;
            color: #edd7cb;
            font-size: 24px;
            letter-spacing: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Градиентная 404 -->
        <div class="error-number">404</div>
        
        <h1>
            <span class="page-word">Страница</span>
            <span class="flew-away">упорхнула</span> 
        </h1>
        
        <p>Кажется, эта вещь исчезла с нашей полки. Но у нас ещё много красивой одежды!</p>
        
        <!-- Декоративные точки -->
        <div class="dots">•••</div>
        
        <!-- Кнопка на главную -->
        <a href="/" class="home-btn">Вернуться в магазин</a>
        
        <!-- Быстрые ссылки -->
        <div class="links">
            <a href="#catalog">Каталог</a>
            <a href="#reviews">Отзывы</a>
            <a href="#contacts">Как найти</a>
        </div>
    </div>

    <!-- БАБОЧКА -->
    <div class="butterfly">
        <img src="assets/img/butterfly.png" >
    </div>
</body>
</html>

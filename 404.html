<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #fffaf4;
            color: #2e2e2e;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            text-align: center;
        }

        /* Градиентное число 404 */
        .error-number {
            font-size: 180px;
            font-weight: 400;
            line-height: 1;
            background: linear-gradient(135deg, #b76e79, #d4a59a, #e8c1a0, #b76e79);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            animation: gradientShift 8s ease infinite;
            background-size: 300% auto;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .butterfly-container {
            margin: 30px 0;
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .butterfly-animation-4 {
            animation: breathe 3.5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1) translateY(0); opacity: 1; }
            50% { transform: scale(1.1) translateY(-10px); opacity: 0.9; }
        }

        /* Заголовок */
        h1 {
            font-size: 42px;
            font-weight: 350;
            color: #573f3f;
            margin-bottom: 20px;
        }

        /* Текст */
        p {
            font-size: 20px;
            color: #7f5a5a;
            margin-bottom: 30px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Кнопка */
        .home-btn {
            display: inline-block;
            font-size: 22px;
            padding: 16px 50px;
            border-radius: 50px;
            text-decoration: none;
            border: none;
            color: white;
            background: linear-gradient(45deg, #b76e79, #d4a59a, #b76e79);
            background-size: 200% auto;
            box-shadow: 0 8px 20px rgba(183,110,121,0.3);
            transition: 0.3s;
            margin-top: 20px;
        }

        .home-btn:hover {
            background-position: right center;
            transform: scale(1.02);
            box-shadow: 0 12px 28px rgba(183,110,121,0.4);
        }

        /* Дополнительные ссылки */
        .links {
            margin-top: 40px;
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            color: #b76e79;
            text-decoration: none;
            font-size: 18px;
            border-bottom: 1px dashed #edd7cb;
            padding-bottom: 3px;
            transition: 0.2s;
        }

        .links a:hover {
            border-bottom-color: #b76e79;
            color: #9e5b65;
        }

        /* Декоративный элемент */
        .dots {
            margin: 30px 0;
            color: #edd7cb;
            font-size: 24px;
            letter-spacing: 8px;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .error-number {
                font-size: 120px;
            }
            
            h1 {
                font-size: 32px;
            }
            
            p {
                font-size: 18px;
                padding: 0 20px;
            }
            
            .butterfly-container {
                min-height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Градиентная 404 -->
        <div class="error-number">404</div>
        
        
        <div class="butterfly-container">

            <img src="assets/img/butterfly.png" 
                 alt="Бабочка" 
                 class="butterfly-animation-4" 
                 style="width: 120px; height: auto; max-width: 100%;">
        </div>
        
        <h1>Страница не найдена</h1>
        
        <p>Кажется, эта вещь исчезла с нашей полки. Но у нас ещё много красивой одежды!</p>
        
        <!-- Декоративные точки -->
        <div class="dots">•••</div>
        
        <!-- Кнопка на главную -->
        <a href="/project/" class="home-btn">Вернуться в магазин</a>
        
        <!-- Быстрые ссылки -->
        <div class="links">
            <a href="#catalog">Каталог</a>
            <a href="#reviews">Отзывы</a>
            <a href="#contacts">Как найти</a>
        </div>
    </div>

</body>
</html>
